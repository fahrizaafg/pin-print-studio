<body>
<div class="app">
  <!-- ═══ LEFT RAIL ═══════════════════════════════════════════════ -->
  <aside class="rail" id="rail" data-od-id="app-rail">
    <div class="rail-brand">
      <div class="rail-mark" aria-hidden="true">P</div>
      <div class="rail-brand-text">
        <div class="rail-title">Pin Print Studio</div>
        <div class="rail-sub" id="rail-project-name">Proyek Tanpa Judul</div>
      </div>
    </div>

    <nav class="rail-nav" data-od-id="rail-nav" aria-label="Navigasi utama">
      <div class="rail-group-label">Studio</div>
      <button class="rail-item is-active" data-nav="home" data-od-id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Beranda
      </button>
      <button class="rail-item" data-nav="editor" data-od-id="nav-editor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
        Editor
        <span class="rail-badge" id="badge-editor">6</span>
      </button>
      <button class="rail-item" data-nav="gallery" data-od-id="nav-gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l4.5-4 4 3.5 3-2.5L21 16"/><circle cx="8.5" cy="9" r="1.4"/></svg>
        Galeri Desain
        <span class="rail-badge" id="badge-gallery">6</span>
      </button>
      <button class="rail-item" data-nav="templates" data-od-id="nav-templates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        Template &amp; Preset
        <span class="rail-badge" id="badge-templates">4</span>
      </button>

      <div class="rail-group-label">Kelola</div>
      <button class="rail-item" data-nav="history" data-od-id="nav-history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4.5h4.5M12 7.5V12l3 2"/></svg>
        Riwayat Proyek
        <span class="rail-badge" id="badge-history">5</span>
      </button>
      <button class="rail-item" data-nav="settings" data-od-id="nav-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M4.2 7.5l1.9 1.1M17.9 15.4l1.9 1.1M4.2 16.5l1.9-1.1M17.9 8.6l1.9-1.1"/></svg>
        Pengaturan
      </button>
      <button class="rail-item" data-nav="help" data-od-id="nav-help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>
        Bantuan
      </button>
    </nav>

    <div class="rail-foot">
      <div class="save-state" data-od-id="save-indicator">
        <span class="save-dot" id="save-dot"></span>
        <span id="save-label">Tersimpan 2 menit lalu</span>
      </div>
      <div class="row2">
        <button class="btn btn-secondary btn-sm" id="rail-save" data-od-id="btn-rail-save">Simpan</button>
        <button class="btn btn-secondary btn-sm" id="rail-preview" data-od-id="btn-rail-preview">Pratinjau</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
