<section class="page is-active" id="page-editor" data-page="editor" data-od-id="page-editor">

  <!-- ─── TOOLBAR BARIS 1: PROYEK ─────────────────────────────── -->
  <header class="toolbar editor-toolbar" data-od-id="editor-toolbar-project">
    <button class="btn btn-ghost btn-icon only-mobile" id="menu-toggle" data-od-id="btn-menu-toggle" aria-label="Buka menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <button class="tb-title" id="btn-rename-project" data-od-id="btn-rename-project" data-tip="Ganti nama proyek">Layout Pin A3 — Kopi Kenangan</button>
    <span class="pill" data-od-id="editor-draft-badge">Draf</span>

    <div class="tb-sep"></div>

    <div class="tb-group" role="group" aria-label="Proyek">
      <button class="btn btn-secondary btn-sm" data-open-dialog="dlg-new-project" data-od-id="btn-new-project" data-tip="Proyek Baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
        Baru
      </button>
      <button class="btn btn-secondary btn-sm" data-open-dialog="dlg-open-project" data-od-id="btn-open-project" data-tip="Buka Proyek">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
        Buka
      </button>
      <button class="btn btn-secondary btn-sm" id="btn-save" data-od-id="btn-save" data-tip="Simpan (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
        Simpan
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" role="group" aria-label="Riwayat tindakan">
      <button class="btn btn-secondary btn-icon" id="btn-undo" data-od-id="btn-undo" data-tip="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a6 6 0 0 1 6 6"/></svg>
      </button>
      <button class="btn btn-secondary btn-icon" id="btn-redo" data-od-id="btn-redo" data-tip="Redo (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m15 7 5 5-5 5"/><path d="M20 12h-9a6 6 0 0 0-6 6"/></svg>
      </button>
    </div>

    <div class="tb-spacer"></div>

    <button class="btn btn-secondary btn-sm only-mobile" id="btn-panel-r" data-od-id="btn-panel-r" data-tip="Pengaturan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M4.2 7.5l1.9 1.1M17.9 15.4l1.9 1.1M4.2 16.5l1.9-1.1M17.9 8.6l1.9-1.1"/></svg>
    </button>
    <button class="btn btn-secondary btn-sm" data-open-dialog="dlg-export" data-od-id="btn-export" data-tip="Ekspor desain">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v10M8.5 10.5 12 14l3.5-3.5"/><path d="M5 18h14"/></svg>
      Ekspor
    </button>
    <button class="btn btn-primary btn-sm" data-open-dialog="dlg-export" data-od-id="btn-export-cta">Ekspor PDF</button>
  </header>

  <!-- ─── TOOLBAR BARIS 2: PRODUKSI ───────────────────────────── -->
  <header class="toolbar editor-toolbar-2" data-od-id="editor-toolbar-production">
    <div class="tb-group" role="group" aria-label="Produksi">
      <button class="btn btn-secondary btn-sm" data-open-dialog="dlg-upload" data-od-id="btn-upload" data-tip="Unggah gambar baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20V9M7.5 13 12 8.5 16.5 13"/><path d="M5 4h14"/></svg>
        Upload Gambar
      </button>
      <button class="btn btn-secondary btn-sm" data-open-dialog="dlg-paper" data-od-id="btn-paper-setup" data-tip="Ukuran, margin, serta orientasi kertas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        Pengaturan Kertas
      </button>
      <button class="btn btn-secondary btn-sm" data-open-dialog="dlg-auto" data-od-id="btn-auto-arrange" data-tip="Susun otomatis seluruh desain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
        Susun Otomatis
      </button>
      <button class="btn btn-secondary btn-sm" id="btn-optimize" data-od-id="btn-optimize" data-tip="Kurangi sisa kertas dengan mengemas lebih rapat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 3 4 14h5l-1 7 9-11h-5z"/></svg>
        Optimalkan Kertas
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" role="group" aria-label="Kontrol tampilan cepat">
      <button class="btn btn-secondary btn-sm is-on" data-toggle="cut" data-od-id="btn-quick-cut" data-tip="Garis potong">Garis Potong</button>
      <button class="btn btn-secondary btn-sm is-on" data-toggle="bleed" data-od-id="btn-quick-bleed" data-tip="Area bleed">Bleed</button>
      <button class="btn btn-secondary btn-sm is-on" data-toggle="grid" data-od-id="btn-quick-grid" data-tip="Garis bantu">Grid</button>
    </div>

    <div class="tb-spacer"></div>

    <button class="btn btn-secondary btn-sm" id="btn-preview-print" data-od-id="btn-preview-print" data-tip="Buka pratinjau cetak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3.5c4.5 0 8 3.2 9 8.5-1 5.3-4.5 8.5-9 8.5S4 17.3 3 12c1-5.3 4.5-8.5 9-8.5z"/><circle cx="12" cy="12" r="3"/></svg>
      Pratinjau Cetak
    </button>
    <button class="btn btn-secondary btn-sm" id="btn-export-png" data-od-id="btn-export-png" data-tip="Ekspor sebagai gambar PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m4 15 4.5-4 4 3.5 3-2.5L20 16"/><circle cx="9" cy="9" r="1.3"/></svg>
      Ekspor PNG
    </button>
    <button class="btn btn-dark btn-sm" id="btn-print" data-od-id="btn-print" data-tip="Kirim ke printer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 9V3h10v6"/><rect x="4" y="9" width="16" height="7" rx="1.5"/><path d="M7 16h10v5H7z"/></svg>
      Cetak
    </button>
  </header>

  <!-- ─── BODY EDITOR (3 KOLOM) ───────────────────────────────── -->
  <div class="editor-body">
